<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step by step — merge sort &amp; quicksort</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", Calibri, Arial, sans-serif; background: #fff;
         color: #24303c; padding: 3vh 4vw; }
  h1 { font-size: 2.2vw; color: #16324f; margin-bottom: .4vh; }
  .sub { font-size: 1.1vw; color: #6b7885; margin-bottom: 3vh; }

  .tabs { margin-bottom: 3vh; }
  .tabs button { font-size: 1.3vw; padding: 1vh 2vw; margin-right: .8vw;
                 border: 2px solid #1a63a9; background: #fff; color: #1a63a9;
                 border-radius: 6px; cursor: pointer; font-weight: 600; }
  .tabs button.active { background: #1a63a9; color: #fff; }
  .tabs button.link { border-style: dashed; }

  .rangewrap { display: inline-flex; border-bottom: 3px solid #1a63a9; padding-bottom: .6vh; }
  .arrayrow { display: flex; gap: .8vw; margin: 2vh 0; justify-content: center; }
  .cell { width: 8vw; height: 8vw; border: 4px solid #d5dde4; border-radius: 8px;
          display: flex; align-items: center; justify-content: center;
          font-size: 3.2vw; font-weight: 700; background: #fff; color: #24303c;
          position: relative; }
  .cell .idx { position: absolute; top: -2.6vh; font-size: 1vw;
               color: #9aa7b4; font-weight: 400; }
  .cell.ask    { border-color: #e8a33d; background: #fdf3e3; }
  .cell.moved  { border-color: #c0392b; background: #fdecea; color: #c0392b; }
  .cell.same   { border-color: #9aa7b4; background: #f2f4f6; }
  .cell.min    { border-color: #1a63a9; background: #e3eefb; color: #1a63a9; }
  .cell.locked { border-color: #82b366; background: #d5e8d4; color: #3d6b2e; }
  .cell.sortedzone { border-color: #7cb0a8; border-style: dashed;
                     background: #e8f4f2; color: #35706a; }
  .cell.splitgap { margin-right: 1.4vw; }
  .cell.faint { opacity: .45; }

  .scratch { margin: 1.4vh 0; }
  .scratchlabel { font-size: 1vw; color: #6b7885; text-transform: uppercase;
                  letter-spacing: .08em; margin-bottom: .6vh; text-align: center; }
  .scratchrow { display: flex; gap: .6vw; justify-content: center; }
  .scratchrow .cell { width: 6vw; height: 6vw; font-size: 2.4vw; }

  .phase { text-align: center; font-size: 1.1vw; letter-spacing: .1em;
           text-transform: uppercase; color: #9aa7b4; min-height: 2.4vh; }

  .status { font-size: 1.6vw; min-height: 6vh; margin: 1.5vh 0;
            padding: 1.8vh 1.4vw; background: #f4f6f8;
            border-left: 6px solid #e8a33d; }
  .status.moved { border-left-color: #c0392b; background: #fdecea; }
  .status.same  { border-left-color: #9aa7b4; }
  .status.mark  { border-left-color: #82b366; background: #f0f8ef; }
  .status.done  { border-left-color: #82b366; background: #f0f8ef;
                  font-weight: 600; }

  .meters { display: flex; gap: 2vw; margin: 2vh 0 3vh 0; }
  .meter { flex: 1; text-align: center; padding: 1.6vh 0;
           border: 2px solid #d5dde4; border-radius: 8px; }
  .meter .label { font-size: 1vw; color: #6b7885; text-transform: uppercase;
                  letter-spacing: .1em; }
  .meter .value { font-size: 2.8vw; font-weight: 700; color: #16324f; }

  .controls button { font-size: 1.3vw; padding: 1.2vh 2vw; margin-right: .8vw;
                     border: none; border-radius: 6px; cursor: pointer;
                     background: #1a63a9; color: #fff; font-weight: 600; }
  .controls button.ghost { background: #fff; color: #1a63a9;
                           border: 2px solid #1a63a9; }
  .controls button:disabled { background: #cfd8e0; color: #fff; cursor: default;
                              border-color: #cfd8e0; }
  .hint { font-size: 1vw; color: #9aa7b4; margin-top: 2vh; line-height: 1.7; }

  .setup { border: 1px solid #dfe6ec; border-radius: 8px; background: #f9fbfc;
           padding: 1.6vh 1.4vw; margin-bottom: 2vh; }
  .setup label { font-size: 1vw; color: #6b7885; text-transform: uppercase;
                 letter-spacing: .08em; display: block; margin-bottom: .8vh; }
  .setup input { font-family: Consolas, monospace; font-size: 1.3vw;
                 padding: .9vh 1vw; width: 34vw; border: 2px solid #cfd8e0;
                 border-radius: 6px; color: #24303c; }
  .setup input:focus { outline: none; border-color: #1a63a9; }
  .setup button { font-size: 1.1vw; padding: 1vh 1.4vw; margin-left: .6vw;
                  border: none; border-radius: 6px; cursor: pointer;
                  background: #1a63a9; color: #fff; font-weight: 600; }
  .setup button.ghost { background: #fff; color: #1a63a9;
                        border: 2px solid #cfd8e0; font-weight: 500; }
  .presets { margin-top: 1.2vh; }
  .presets span { font-size: .95vw; color: #9aa7b4; margin-right: .6vw; }
  .error { color: #c0392b; font-size: 1vw; margin-top: 1vh; min-height: 1.6vh; }
</style>
</head>
<body>

<h1>Step by step</h1>
<p class="sub">Arrow keys or buttons to advance &middot; Enter finishes the current step</p>

<div class="setup">
  <label for="arrayInput">Array to sort &mdash; between 3 and 10 whole numbers</label>
  <input id="arrayInput" type="text" value="42, 17, 5, 30, 8, 29, 3, 15">
  <button id="btnApply">Sort this</button>
  <button id="btnDefault" class="ghost">Default</button>
  <div class="presets">
    <span>Try:</span>
    <button class="ghost" data-preset="3, 5, 8, 15, 17, 29, 30, 42">already sorted</button>
    <button class="ghost" data-preset="42, 30, 29, 17, 15, 8, 5, 3">reversed</button>
    <button class="ghost" data-preset="7, 3, 7, 1, 3, 9, 1, 5">with duplicates</button>
  </div>
  <div class="error" id="error"></div>
</div>

<div class="tabs">
  <button id="tabMerge" class="active">Merge sort</button>
  <button id="tabQuick">Quicksort</button>
  <button id="tabTree" class="link">Recursion tree &#8599;</button>
</div>

<div class="phase" id="phase"></div>
<div id="stage"></div>
<div class="status" id="status"></div>

<div class="meters">
  <div class="meter"><div class="label" id="lCall">Merge</div><div class="value" id="mCall">1</div></div>
  <div class="meter"><div class="label">Comparisons</div><div class="value" id="mCmp">0</div></div>
  <div class="meter"><div class="label" id="lThird">Placements</div><div class="value" id="mThird">0</div></div>
</div>

<div class="controls">
  <button id="btnPrev" class="ghost">&larr; Back</button>
  <button id="btnNext">Next &rarr;</button>
  <button id="btnPass" class="ghost">Finish this step</button>
  <button id="btnReset" class="ghost">Reset</button>
</div>

<p class="hint" id="hint"></p>

<script>
var SOURCE = [42, 17, 5, 30, 8, 29, 3, 15];

var HINT_MERGE =
  '<span style="color:#e8a33d">&#9632;</span> being compared &nbsp;&nbsp;' +
  '<span style="color:#c0392b">&#9632;</span> just placed &nbsp;&nbsp;' +
  '<span style="color:#9aa7b4">&#9632;</span> already copied out of the buffer &nbsp;&nbsp;' +
  '<span style="color:#7cb0a8">&#9632;</span> sorted for this merge, may still change later &nbsp;&nbsp;' +
  '<span style="color:#82b366">&#9632;</span> final position';

var HINT_QUICK =
  '<span style="color:#1a63a9">&#9632;</span> the pivot &nbsp;&nbsp;' +
  '<span style="color:#e8a33d">&#9632;</span> being compared to the pivot &nbsp;&nbsp;' +
  '<span style="color:#c0392b">&#9632;</span> just swapped &nbsp;&nbsp;' +
  '<span style="color:#9aa7b4">&#9632;</span> greater than the pivot, stays for now &nbsp;&nbsp;' +
  '<span style="color:#7cb0a8">&#9632;</span> confirmed for this side, may still move within it &nbsp;&nbsp;' +
  '<span style="color:#82b366">&#9632;</span> pivot placed, final for good';

function mergeSteps(source) {
  var a = source.slice();
  var n = a.length;
  var steps = [];
  var comparisons = 0, placements = 0, callCount = 0;

  function frame(f) {
    var base = {
      array: a.slice(), comparisons: comparisons, placements: placements,
      view: 'divide', lo: 0, hi: n - 1, mid: -1,
      left: [], right: [], li: -1, ri: -1, k: -1, writtenIdx: -1, taken: null,
      call: callCount, kind: 'mark', mark: false, done: false,
      phase: '', text: ''
    };
    for (var key in f) base[key] = f[key];
    steps.push(base);
  }

  function merge(lo, mid, hi, callIdx) {
    var left = a.slice(lo, mid + 1);
    var right = a.slice(mid + 1, hi + 1);
    var li = 0, ri = 0, k = lo;
    frame({
      view: 'merge', lo: lo, hi: hi, mid: mid, left: left, right: right,
      li: li, ri: ri, k: k, call: callIdx, kind: 'mark', mark: true,
      phase: 'Merge a[' + lo + '..' + mid + '] + a[' + (mid + 1) + '..' + hi + ']',
      text: 'Both halves are already sorted on their own. Time to merge them.'
    });
    while (li < left.length && ri < right.length) {
      frame({
        view: 'merge', lo: lo, hi: hi, mid: mid, left: left, right: right,
        li: li, ri: ri, k: k, call: callIdx, kind: 'ask',
        phase: 'Comparing',
        text: 'Is ' + left[li] + ' less than or equal to ' + right[ri] + '?'
      });
      comparisons++;
      var takeLeft = left[li] <= right[ri];
      var val = takeLeft ? left[li] : right[ri];
      var writtenIdx = k;
      a[k] = val;
      placements++;
      if (takeLeft) { li++; } else { ri++; }
      k++;
      frame({
        view: 'merge', lo: lo, hi: hi, mid: mid, left: left, right: right,
        li: li, ri: ri, k: k, writtenIdx: writtenIdx, taken: takeLeft ? 'L' : 'R',
        array: a.slice(), call: callIdx, kind: 'moved',
        phase: takeLeft ? 'Take from the left' : 'Take from the right',
        text: 'Yes, take ' + val + '. It goes into position ' + writtenIdx + '.'
      });
    }
    if (li < left.length || ri < right.length) {
      var fromLeft = li < left.length;
      var restText = fromLeft
        ? 'The right side is empty. Copy the rest of the left side directly, no comparison needed.'
        : 'The left side is empty. Copy the rest of the right side directly, no comparison needed.';
      while (li < left.length) { a[k] = left[li]; placements++; li++; k++; }
      while (ri < right.length) { a[k] = right[ri]; placements++; ri++; k++; }
      frame({
        view: 'merge', lo: lo, hi: hi, mid: mid, left: left, right: right,
        li: li, ri: ri, k: k, array: a.slice(), call: callIdx, kind: 'moved', mark: true,
        phase: 'Copy remainder', text: restText
      });
    }
    frame({
      view: 'merge', lo: lo, hi: hi, mid: mid, left: left, right: right,
      li: li, ri: ri, k: k, array: a.slice(), call: callIdx, kind: 'done', mark: true,
      phase: 'Merged',
      text: 'a[' + lo + '..' + hi + '] is now sorted among itself: ' + a.slice(lo, hi + 1).join(', ') + '.'
    });
  }

  function mergeSort(lo, hi) {
    if (lo >= hi) { return; }
    callCount++;
    var thisCall = callCount;
    var mid = Math.floor((lo + hi) / 2);
    frame({
      view: 'divide', lo: lo, hi: hi, mid: mid, call: thisCall, kind: 'mark', mark: true,
      phase: 'Divide a[' + lo + '..' + hi + ']',
      text: 'Split it into a[' + lo + '..' + mid + '] and a[' + (mid + 1) + '..' + hi + '].'
    });
    mergeSort(lo, mid);
    mergeSort(mid + 1, hi);
    merge(lo, mid, hi, thisCall);
  }

  mergeSort(0, n - 1);
  frame({
    view: 'divide', lo: 0, hi: n - 1, mid: -1, array: a.slice(), kind: 'done', mark: true, done: true,
    phase: 'Done', text: 'Sorted. ' + comparisons + ' comparisons, ' + placements + ' placements.'
  });
  return steps;
}

function quickSteps(source) {
  var a = source.slice();
  var n = a.length;
  var steps = [];
  var comparisons = 0, swaps = 0, callCount = 0;
  var placed = [];

  function frame(f) {
    var base = {
      array: a.slice(), comparisons: comparisons, swaps: swaps,
      lo: 0, hi: n - 1, pivot: -1, ask: -1, swapPair: null, teal: -1, gray0: -1, gray1: -1,
      green: placed.slice(), call: callCount, kind: 'mark', mark: false, done: false,
      phase: '', text: ''
    };
    for (var key in f) base[key] = f[key];
    steps.push(base);
  }

  function partition(lo, hi) {
    callCount++;
    var thisCall = callCount;
    var pivot = a[hi];
    frame({
      lo: lo, hi: hi, pivot: hi, teal: lo - 1, gray0: -1, gray1: -1,
      call: thisCall, kind: 'mark', mark: true,
      phase: 'Partition a[' + lo + '..' + hi + ']',
      text: 'Pivot is ' + pivot + ', the last element of this range.'
    });
    var i = lo - 1;
    for (var j = lo; j < hi; j++) {
      frame({
        lo: lo, hi: hi, pivot: hi, ask: j, teal: i, gray0: i + 1, gray1: j - 1,
        call: thisCall, kind: 'ask', phase: 'Comparing',
        text: 'Is ' + a[j] + ' less than or equal to the pivot ' + pivot + '?'
      });
      comparisons++;
      var le = a[j] <= pivot;
      if (le) {
        i++;
        if (i !== j) {
          var t = a[i]; a[i] = a[j]; a[j] = t;
          swaps++;
          frame({
            lo: lo, hi: hi, pivot: hi, teal: i - 1, gray0: -1, gray1: -1,
            swapPair: [i, j], call: thisCall, kind: 'moved', phase: 'Swap',
            text: 'Yes. ' + a[i] + ' moves to the low side, ' + a[j] + ' takes its place.'
          });
        } else {
          frame({
            lo: lo, hi: hi, pivot: hi, teal: i, gray0: -1, gray1: -1,
            call: thisCall, kind: 'same', phase: 'Already there',
            text: 'Yes. ' + a[j] + ' was already on the low side.'
          });
        }
      } else {
        frame({
          lo: lo, hi: hi, pivot: hi, teal: i, gray0: i + 1, gray1: j,
          call: thisCall, kind: 'same', phase: 'Stays',
          text: 'No. ' + a[j] + ' is greater than the pivot. It stays on the high side for now.'
        });
      }
    }
    var pivotIndex = i + 1;
    var finalPair = null;
    if (pivotIndex !== hi) {
      var t2 = a[pivotIndex]; a[pivotIndex] = a[hi]; a[hi] = t2;
      swaps++;
      finalPair = [pivotIndex, hi];
    }
    placed.push(pivotIndex);
    frame({
      lo: lo, hi: hi, pivot: -1, teal: pivotIndex - 1, gray0: pivotIndex + 1, gray1: hi,
      swapPair: finalPair, green: placed.slice(), call: thisCall, kind: 'done', mark: true,
      phase: 'Pivot placed',
      text: pivot + ' is now at index ' + pivotIndex + '. That position is correct for good.'
    });
    return pivotIndex;
  }

  function sort(lo, hi) {
    if (lo < hi) {
      var p = partition(lo, hi);
      sort(lo, p - 1);
      sort(p + 1, hi);
    }
  }

  sort(0, n - 1);
  var allIdx = [];
  for (var gi = 0; gi < n; gi++) { allIdx.push(gi); }
  frame({
    lo: 0, hi: n - 1, pivot: -1, teal: -1, gray0: -1, gray1: -1, green: allIdx,
    kind: 'done', mark: true, done: true,
    phase: 'Done', text: 'Sorted. ' + comparisons + ' comparisons, ' + swaps + ' swaps.'
  });
  return steps;
}

var DEFAULT_TEXT = '42, 17, 5, 30, 8, 29, 3, 15';
var sets = {};
var mode = 'merge';
var at = 0;

function parseArray(text) {
  var pieces = text.split(/[\s,]+/);
  var out = [];
  for (var i = 0; i < pieces.length; i++) {
    if (pieces[i] === '') { continue; }
    if (!/^-?\d+$/.test(pieces[i])) {
      return { error: '"' + pieces[i] + '" is not a whole number.' };
    }
    out.push(parseInt(pieces[i], 10));
  }
  if (out.length < 3) { return { error: 'Give at least 3 numbers.' }; }
  if (out.length > 10) { return { error: 'Ten numbers at most, or they will not fit on screen.' }; }
  return { values: out };
}

function build(values) {
  sets = { merge: mergeSteps(values), quick: quickSteps(values) };
  at = 0;
}

function cellHtml(value, cls, idx) {
  var idxHtml = idx === null ? '' : '<span class="idx">' + idx + '</span>';
  return '<div class="cell ' + cls + '">' + idxHtml + value + '</div>';
}

function quickCellClass(f, k) {
  if (f.green.indexOf(k) !== -1) { return 'locked'; }
  if (k < f.lo || k > f.hi) { return ''; }
  if (k === f.pivot) { return 'min'; }
  if (f.swapPair && (k === f.swapPair[0] || k === f.swapPair[1])) { return 'moved'; }
  if (k === f.ask) { return 'ask'; }
  if (f.teal >= f.lo && k <= f.teal) { return 'sortedzone'; }
  if (f.gray1 >= f.gray0 && k >= f.gray0 && k <= f.gray1) { return 'same'; }
  return '';
}

function renderQuick(f) {
  var html = '<div class="arrayrow">';
  for (var k = 0; k < f.array.length; k++) {
    var inRange = k >= f.lo && k <= f.hi;
    html += cellHtml(f.array[k], quickCellClass(f, k) + (inRange ? '' : ' faint'), k);
  }
  html += '</div>';
  document.getElementById('stage').innerHTML = html;
}

function mergeBigCellClass(f, k) {
  if (f.done) { return 'locked'; }
  if (k < f.lo || k > f.hi) { return ''; }
  if (f.writtenIdx === k) { return 'moved'; }
  if (f.k >= 0 && k >= f.lo && k < f.k) { return 'sortedzone'; }
  return '';
}

function renderMerge(f) {
  var html = '<div class="arrayrow">';
  for (var k = 0; k < f.array.length; k++) {
    var inRange = k >= f.lo && k <= f.hi;
    var cls = mergeBigCellClass(f, k);
    if (f.mid >= 0 && k === f.mid) { cls += ' splitgap'; }
    html += cellHtml(f.array[k], cls + (inRange ? '' : ' faint'), k);
  }
  html += '</div>';
  if (f.view === 'merge') {
    html += '<div class="scratch"><div class="scratchlabel">Left</div><div class="scratchrow">';
    for (var li = 0; li < f.left.length; li++) {
      var lcls = '';
      if (li < f.li) { lcls = 'same'; }
      else if (li === f.li && f.kind === 'ask') { lcls = 'ask'; }
      else if (li === f.li && f.taken === 'L') { lcls = 'moved'; }
      html += cellHtml(f.left[li], lcls, null);
    }
    html += '</div></div>';
    html += '<div class="scratch"><div class="scratchlabel">Right</div><div class="scratchrow">';
    for (var ri = 0; ri < f.right.length; ri++) {
      var rcls = '';
      if (ri < f.ri) { rcls = 'same'; }
      else if (ri === f.ri && f.kind === 'ask') { rcls = 'ask'; }
      else if (ri === f.ri && f.taken === 'R') { rcls = 'moved'; }
      html += cellHtml(f.right[ri], rcls, null);
    }
    html += '</div></div>';
  }
  document.getElementById('stage').innerHTML = html;
}

function render() {
  var steps = sets[mode];
  var f = steps[at];

  if (mode === 'quick') { renderQuick(f); } else { renderMerge(f); }

  document.getElementById('phase').textContent = f.phase;
  document.getElementById('status').className = 'status ' + f.kind;
  document.getElementById('status').textContent = f.text;
  document.getElementById('hint').innerHTML = mode === 'quick' ? HINT_QUICK : HINT_MERGE;

  document.getElementById('lCall').textContent = mode === 'quick' ? 'Partition' : 'Merge';
  document.getElementById('mCall').textContent = f.call || '-';
  document.getElementById('mCmp').textContent = f.comparisons;
  document.getElementById('lThird').textContent = mode === 'quick' ? 'Swaps' : 'Placements';
  document.getElementById('mThird').textContent = mode === 'quick' ? f.swaps : f.placements;

  document.getElementById('btnPrev').disabled = at === 0;
  document.getElementById('btnNext').disabled = at === steps.length - 1;
  document.getElementById('btnPass').disabled = at === steps.length - 1;
}

function go(n) {
  var steps = sets[mode];
  at = Math.max(0, Math.min(steps.length - 1, n));
  render();
}

function finishStep() {
  var steps = sets[mode];
  var k = at + 1;
  while (k < steps.length && !steps[k].mark && !steps[k].done) { k++; }
  go(k);
}

function setMode(next) {
  mode = next;
  at = 0;
  document.getElementById('tabMerge').className = next === 'merge' ? 'active' : '';
  document.getElementById('tabQuick').className = next === 'quick' ? 'active' : '';
  render();
}

document.getElementById('btnNext').onclick = function () { go(at + 1); };
document.getElementById('btnPrev').onclick = function () { go(at - 1); };
document.getElementById('btnPass').onclick = finishStep;
document.getElementById('btnReset').onclick = function () { go(0); };
document.getElementById('tabMerge').onclick = function () { setMode('merge'); };
document.getElementById('tabQuick').onclick = function () { setMode('quick'); };
document.getElementById('tabTree').onclick = function () {
  window.location.href = mode === 'quick' ? 'quicksort-recursion-tree-lomuto-firstpivot-full.html' : 'merge-sort-recursion-tree.html';
};

var elInput = document.getElementById('arrayInput');
var elError = document.getElementById('error');

function apply(text) {
  var result = parseArray(text);
  if (result.error) {
    elError.textContent = result.error;
    return;
  }
  elError.textContent = '';
  build(result.values);
  render();
}

document.getElementById('btnApply').onclick = function () { apply(elInput.value); };
document.getElementById('btnDefault').onclick = function () {
  elInput.value = DEFAULT_TEXT;
  apply(DEFAULT_TEXT);
};

var presets = document.querySelectorAll('[data-preset]');
for (var p = 0; p < presets.length; p++) {
  presets[p].onclick = function () {
    elInput.value = this.getAttribute('data-preset');
    apply(elInput.value);
  };
}

document.addEventListener('keydown', function (e) {
  if (document.activeElement === elInput) {
    if (e.key === 'Enter') { apply(elInput.value); e.preventDefault(); }
    return;
  }
  if (e.key === 'ArrowRight' || e.key === ' ') { go(at + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { go(at - 1); e.preventDefault(); }
  if (e.key === 'Enter') { finishStep(); e.preventDefault(); }
});

build(SOURCE);
setMode('merge');
</script>

</body>
</html>
