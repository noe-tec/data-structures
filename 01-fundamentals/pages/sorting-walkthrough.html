<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step by step — quadratic sorts</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", Calibri, Arial, sans-serif; background: #fff;
         color: #24303c; padding: 3vh 4vw; }
  h1 { font-size: 2.2vw; color: #16324f; margin-bottom: .4vh; }
  .sub { font-size: 1.1vw; color: #6b7885; margin-bottom: 3vh; }

  .tabs { margin-bottom: 3vh; }
  .tabs button { font-size: 1.3vw; padding: 1vh 2vw; margin-right: .8vw;
                 border: 2px solid #1a63a9; background: #fff; color: #1a63a9;
                 border-radius: 6px; cursor: pointer; font-weight: 600; }
  .tabs button.active { background: #1a63a9; color: #fff; }

  .array { display: flex; gap: .8vw; margin: 4vh 0 2vh 0; justify-content: center; }
  .cell { width: 8vw; height: 8vw; border: 4px solid #d5dde4; border-radius: 8px;
          display: flex; align-items: center; justify-content: center;
          font-size: 3.2vw; font-weight: 700; background: #fff; color: #24303c;
          position: relative; }
  .cell .idx { position: absolute; top: -2.6vh; font-size: 1vw;
               color: #9aa7b4; font-weight: 400; }
  .cell.ask    { border-color: #e8a33d; background: #fdf3e3; }
  .cell.moved  { border-color: #c0392b; background: #fdecea; color: #c0392b; }
  .cell.same   { border-color: #9aa7b4; background: #f2f4f6; }
  .cell.min    { border-color: #1a63a9; background: #e3eefb; color: #1a63a9; }
  .cell.locked { border-color: #82b366; background: #d5e8d4; color: #3d6b2e; }
  .cell.sortedzone { border-color: #7cb0a8; border-style: dashed;
                     background: #e8f4f2; color: #35706a; }

  .phase { text-align: center; font-size: 1.1vw; letter-spacing: .1em;
           text-transform: uppercase; color: #9aa7b4; min-height: 2.4vh; }

  .status { font-size: 1.7vw; min-height: 6vh; margin: 1.5vh 0;
            padding: 1.8vh 1.4vw; background: #f4f6f8;
            border-left: 6px solid #e8a33d; }
  .status.moved { border-left-color: #c0392b; background: #fdecea; }
  .status.same  { border-left-color: #9aa7b4; }
  .status.mark  { border-left-color: #82b366; background: #f0f8ef; }
  .status.done  { border-left-color: #82b366; background: #f0f8ef;
                  font-weight: 600; }

  .meters { display: flex; gap: 2vw; margin: 2vh 0 3vh 0; }
  .meter { flex: 1; text-align: center; padding: 1.6vh 0;
           border: 2px solid #d5dde4; border-radius: 8px; }
  .meter .label { font-size: 1vw; color: #6b7885; text-transform: uppercase;
                  letter-spacing: .1em; }
  .meter .value { font-size: 2.8vw; font-weight: 700; color: #16324f; }

  .controls button { font-size: 1.3vw; padding: 1.2vh 2vw; margin-right: .8vw;
                     border: none; border-radius: 6px; cursor: pointer;
                     background: #1a63a9; color: #fff; font-weight: 600; }
  .controls button.ghost { background: #fff; color: #1a63a9;
                           border: 2px solid #1a63a9; }
  .controls button:disabled { background: #cfd8e0; color: #fff; cursor: default;
                              border-color: #cfd8e0; }
  .hint { font-size: 1vw; color: #9aa7b4; margin-top: 2vh; line-height: 1.7; }

  .setup { border: 1px solid #dfe6ec; border-radius: 8px; background: #f9fbfc;
           padding: 1.6vh 1.4vw; margin-bottom: 2vh; }
  .setup label { font-size: 1vw; color: #6b7885; text-transform: uppercase;
                 letter-spacing: .08em; display: block; margin-bottom: .8vh; }
  .setup input { font-family: Consolas, monospace; font-size: 1.3vw;
                 padding: .9vh 1vw; width: 34vw; border: 2px solid #cfd8e0;
                 border-radius: 6px; color: #24303c; }
  .setup input:focus { outline: none; border-color: #1a63a9; }
  .setup button { font-size: 1.1vw; padding: 1vh 1.4vw; margin-left: .6vw;
                  border: none; border-radius: 6px; cursor: pointer;
                  background: #1a63a9; color: #fff; font-weight: 600; }
  .setup button.ghost { background: #fff; color: #1a63a9;
                        border: 2px solid #cfd8e0; font-weight: 500; }
  .presets { margin-top: 1.2vh; }
  .presets span { font-size: .95vw; color: #9aa7b4; margin-right: .6vw; }
  .error { color: #c0392b; font-size: 1vw; margin-top: 1vh; min-height: 1.6vh; }
</style>
</head>
<body>

<h1>Step by step</h1>
<p class="sub">Arrow keys or buttons to advance &middot; Enter finishes the current pass</p>

<div class="setup">
  <label for="arrayInput">Array to sort &mdash; between 3 and 12 whole numbers</label>
  <input id="arrayInput" type="text" value="42, 17, 5, 30, 8, 29, 3, 15">
  <button id="btnApply">Sort this</button>
  <button id="btnDefault" class="ghost">Default</button>
  <div class="presets">
    <span>Try:</span>
    <button class="ghost" data-preset="3, 5, 8, 15, 17, 29, 30, 42">already sorted</button>
    <button class="ghost" data-preset="42, 30, 29, 17, 15, 8, 5, 3">reversed</button>
    <button class="ghost" data-preset="7, 3, 7, 1, 3, 9, 1, 5">with duplicates</button>
    <button class="ghost" data-preset="1, 2, 3, 4, 5, 6, 7, 0">one out of place</button>
  </div>
  <div class="error" id="error"></div>
</div>

<div class="tabs">
  <button id="tabBubble" class="active">Bubble sort</button>
  <button id="tabSelection">Selection sort</button>
  <button id="tabInsertion">Insertion sort</button>
</div>

<div class="phase" id="phase"></div>
<div class="array" id="array"></div>
<div class="status" id="status"></div>

<div class="meters">
  <div class="meter"><div class="label">Pass</div><div class="value" id="mPass">1</div></div>
  <div class="meter"><div class="label">Comparisons</div><div class="value" id="mCmp">0</div></div>
  <div class="meter"><div class="label" id="lMov">Swaps</div><div class="value" id="mSwp">0</div></div>
</div>

<div class="controls">
  <button id="btnPrev" class="ghost">&larr; Back</button>
  <button id="btnNext">Next &rarr;</button>
  <button id="btnPass" class="ghost">Finish this pass</button>
  <button id="btnReset" class="ghost">Reset</button>
</div>

<p class="hint">
  <span style="color:#e8a33d">&#9632;</span> being compared &nbsp;&nbsp;
  <span style="color:#c0392b">&#9632;</span> just moved &nbsp;&nbsp;
  <span style="color:#9aa7b4">&#9632;</span> compared, left alone &nbsp;&nbsp;
  <span style="color:#1a63a9">&#9632;</span> value being placed &nbsp;&nbsp;
  <span style="color:#7cb0a8">&#9632;</span> sorted so far, may still shift &nbsp;&nbsp;
  <span style="color:#82b366">&#9632;</span> final position
</p>

<script>
var SOURCE = [42, 17, 5, 30, 8, 29, 3, 15];

function blank() {
  return { ask: [], moved: [], same: [], min: -1,
           lockedFrom: -1, lockedTo: -1, sortedTo: -1 };
}

function step(base, extra) {
  var s = blank();
  var k;
  for (k in base) { s[k] = base[k]; }
  for (k in extra) { s[k] = extra[k]; }
  return s;
}

function bubbleSteps(source) {
  var a = source.slice();
  var n = a.length;
  var steps = [];
  var comparisons = 0, swaps = 0;
  var moving = true;
  var pass;

  for (pass = 0; pass < n - 1 && moving; pass++) {
    moving = false;
    for (var j = 0; j < n - 1 - pass; j++) {
      comparisons++;
      var left = a[j], right = a[j + 1];

      steps.push(step({
        array: a.slice(), ask: [j, j + 1], lockedFrom: n - pass,
        pass: pass + 1, comparisons: comparisons, swaps: swaps,
        kind: 'ask', phase: 'Comparing',
        text: 'Is ' + left + ' greater than ' + right + '?'
      }, {}));

      var didSwap = right < left;
      if (didSwap) {
        var t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;
        swaps++;
        moving = true;
      }

      steps.push(step({
        array: a.slice(), lockedFrom: n - pass,
        pass: pass + 1, comparisons: comparisons, swaps: swaps,
        kind: didSwap ? 'moved' : 'same',
        phase: didSwap ? 'Swapped' : 'No change',
        text: didSwap
          ? 'Yes. ' + left + ' > ' + right + ' → they trade places.'
          : 'No. ' + left + ' ≤ ' + right + ' → nothing moves.'
      }, didSwap ? { moved: [j, j + 1] } : { same: [j, j + 1] }));
    }

    steps.push(step({
      array: a.slice(), lockedFrom: n - pass - 1,
      pass: pass + 1, comparisons: comparisons, swaps: swaps,
      kind: 'mark', mark: true, phase: 'End of pass ' + (pass + 1),
      text: 'The largest remaining value reached the end. ' + (pass + 1) +
            ' value(s) are final and will not be looked at again.'
    }, {}));
  }

  steps.push(step({
    array: a.slice(), lockedFrom: 0,
    pass: pass, comparisons: comparisons, swaps: swaps,
    kind: 'done', done: true, phase: 'Done',
    text: 'Sorted. ' + comparisons + ' comparisons, ' + swaps + ' swaps.'
  }, {}));
  return steps;
}

function selectionSteps(source) {
  var a = source.slice();
  var n = a.length;
  var steps = [];
  var comparisons = 0, swaps = 0;

  for (var i = 0; i < n - 1; i++) {
    var minIndex = i;

    steps.push(step({
      array: a.slice(), min: minIndex, lockedTo: i,
      pass: i + 1, comparisons: comparisons, swaps: swaps,
      kind: 'mark', mark: true, phase: 'Pass ' + (i + 1) + ' begins',
      text: 'Assume ' + a[i] + ' is the smallest of everything left.'
    }, {}));

    for (var j = i + 1; j < n; j++) {
      comparisons++;
      var seen = a[j], current = a[minIndex];

      steps.push(step({
        array: a.slice(), ask: [j], min: minIndex, lockedTo: i,
        pass: i + 1, comparisons: comparisons, swaps: swaps,
        kind: 'ask', phase: 'Comparing',
        text: 'Is ' + seen + ' smaller than ' + current + '?'
      }, {}));

      var better = seen < current;
      if (better) { minIndex = j; }

      steps.push(step({
        array: a.slice(), min: minIndex, lockedTo: i,
        pass: i + 1, comparisons: comparisons, swaps: swaps,
        kind: better ? 'moved' : 'same',
        phase: better ? 'New smallest' : 'No change',
        text: better
          ? 'Yes. The smallest so far is now ' + seen + '. Nothing has moved yet.'
          : 'No. ' + current + ' is still the smallest. Nothing has moved.'
      }, better ? {} : { same: [j] }));
    }

    var willMove = minIndex !== i;
    var mover = a[minIndex];
    if (willMove) {
      var t2 = a[i]; a[i] = a[minIndex]; a[minIndex] = t2;
      swaps++;
    }

    steps.push(step({
      array: a.slice(), lockedTo: i + 1,
      pass: i + 1, comparisons: comparisons, swaps: swaps,
      kind: willMove ? 'moved' : 'mark',
      phase: willMove ? 'One swap' : 'No swap needed',
      text: willMove
        ? 'End of the pass. ' + mover + ' moves into position ' + i +
          '. That is the only movement of this whole pass.'
        : mover + ' was already in position ' + i + '. No swap.'
    }, willMove ? { moved: [i, minIndex] } : {}));
  }

  steps.push(step({
    array: a.slice(), lockedTo: n,
    pass: n - 1, comparisons: comparisons, swaps: swaps,
    kind: 'done', done: true, phase: 'Done',
    text: 'Sorted. ' + comparisons + ' comparisons, ' + swaps + ' swaps.'
  }, {}));
  return steps;
}

function insertionSteps(source) {
  var a = source.slice();
  var n = a.length;
  var steps = [];
  var comparisons = 0, shifts = 0;

  for (var i = 1; i < n; i++) {
    var key = a[i];

    steps.push(step({
      array: a.slice(), min: i, sortedTo: i,
      pass: i, comparisons: comparisons, swaps: shifts,
      kind: 'mark', mark: true, phase: 'Pass ' + i + ' — taking ' + key,
      text: 'Hold ' + key + ' aside. The first ' + i +
            ' values are already sorted among themselves. Where does ' +
            key + ' belong?'
    }, {}));

    var j = i - 1;
    var stopped = false;

    while (j >= 0) {
      comparisons++;
      var here = a[j];

      steps.push(step({
        array: a.slice(), ask: [j], sortedTo: i,
        pass: i, comparisons: comparisons, swaps: shifts,
        kind: 'ask', phase: 'Comparing',
        text: 'Is ' + here + ' greater than ' + key + '?'
      }, {}));

      if (here > key) {
        a[j + 1] = a[j];
        shifts++;
        steps.push(step({
          array: a.slice(), moved: [j + 1], sortedTo: i,
          pass: i, comparisons: comparisons, swaps: shifts,
          kind: 'moved', phase: 'Shift right',
          text: 'Yes. ' + here + ' slides one place to the right to make room.'
        }, {}));
        j--;
      } else {
        steps.push(step({
          array: a.slice(), same: [j], sortedTo: i,
          pass: i, comparisons: comparisons, swaps: shifts,
          kind: 'same', phase: 'Stop',
          text: 'No. ' + here + ' ≤ ' + key + ', so ' + key +
                ' belongs right after it. Stop sliding.'
        }, {}));
        stopped = true;
        break;
      }
    }

    if (!stopped) {
      steps.push(step({
        array: a.slice(), sortedTo: i,
        pass: i, comparisons: comparisons, swaps: shifts,
        kind: 'same', phase: 'Left end',
        text: 'Reached the left end. ' + key +
              ' is smaller than everything sorted so far.'
      }, {}));
    }

    a[j + 1] = key;

    steps.push(step({
      array: a.slice(), moved: [j + 1], sortedTo: i + 1,
      pass: i, comparisons: comparisons, swaps: shifts,
      kind: 'moved', mark: true, phase: 'Placed',
      text: key + ' drops into position ' + (j + 1) + '. The first ' +
            (i + 1) + ' values are sorted among themselves — but any of them ' +
            'can still shift later.'
    }, {}));
  }

  steps.push(step({
    array: a.slice(), lockedTo: n,
    pass: n - 1, comparisons: comparisons, swaps: shifts,
    kind: 'done', done: true, phase: 'Done',
    text: 'Sorted. ' + comparisons + ' comparisons, ' + shifts + ' shifts.'
  }, {}));
  return steps;
}

var DEFAULT_TEXT = '42, 17, 5, 30, 8, 29, 3, 15';
var sets = {};
var labels = { bubble: 'Swaps', selection: 'Swaps', insertion: 'Shifts' };
var mode = 'bubble';
var at = 0;

// Accepts numbers separated by commas, spaces or both.
function parseArray(text) {
  var pieces = text.split(/[\s,]+/);
  var out = [];
  for (var i = 0; i < pieces.length; i++) {
    if (pieces[i] === '') { continue; }
    if (!/^-?\d+$/.test(pieces[i])) {
      return { error: '"' + pieces[i] + '" is not a whole number.' };
    }
    out.push(parseInt(pieces[i], 10));
  }
  if (out.length < 3) { return { error: 'Give at least 3 numbers.' }; }
  if (out.length > 12) { return { error: 'Twelve numbers at most, or they will not fit on screen.' }; }
  return { values: out };
}

function build(values) {
  sets = {
    bubble: bubbleSteps(values),
    selection: selectionSteps(values),
    insertion: insertionSteps(values)
  };
  at = 0;
}

var elArray = document.getElementById('array');
var elStatus = document.getElementById('status');
var elPhase = document.getElementById('phase');

function render() {
  var steps = sets[mode];
  var s = steps[at];
  var html = '';

  // Cells shrink so that a longer array still fits on one row.
  var side = Math.min(8, 72 / s.array.length);
  var box = 'width:' + side + 'vw;height:' + side + 'vw;font-size:' +
            (side * 0.4) + 'vw;';

  for (var k = 0; k < s.array.length; k++) {
    var cls = 'cell';
    if (s.sortedTo >= 0 && k < s.sortedTo) { cls += ' sortedzone'; }
    if (s.lockedFrom >= 0 && k >= s.lockedFrom) { cls += ' locked'; }
    if (s.lockedTo >= 0 && k < s.lockedTo) { cls += ' locked'; }
    if (s.min === k) { cls += ' min'; }
    if (s.same.indexOf(k) !== -1) { cls += ' same'; }
    if (s.moved.indexOf(k) !== -1) { cls += ' moved'; }
    if (s.ask.indexOf(k) !== -1) { cls += ' ask'; }
    html += '<div class="' + cls + '" style="' + box + '">' +
            '<span class="idx">' + k + '</span>' + s.array[k] + '</div>';
  }
  elArray.innerHTML = html;

  elPhase.textContent = s.phase;
  elStatus.className = 'status ' + s.kind;
  elStatus.textContent = s.text;

  document.getElementById('mPass').textContent = s.pass;
  document.getElementById('mCmp').textContent = s.comparisons;
  document.getElementById('mSwp').textContent = s.swaps;
  document.getElementById('lMov').textContent = labels[mode];

  document.getElementById('btnPrev').disabled = at === 0;
  document.getElementById('btnNext').disabled = at === steps.length - 1;
  document.getElementById('btnPass').disabled = at === steps.length - 1;
}

function go(n) {
  var steps = sets[mode];
  at = Math.max(0, Math.min(steps.length - 1, n));
  render();
}

function finishPass() {
  var steps = sets[mode];
  var k = at + 1;
  while (k < steps.length && !steps[k].mark && !steps[k].done) { k++; }
  go(k);
}

function setMode(next) {
  mode = next;
  at = 0;
  document.getElementById('tabBubble').className =
    next === 'bubble' ? 'active' : '';
  document.getElementById('tabSelection').className =
    next === 'selection' ? 'active' : '';
  document.getElementById('tabInsertion').className =
    next === 'insertion' ? 'active' : '';
  render();
}

document.getElementById('btnNext').onclick = function () { go(at + 1); };
document.getElementById('btnPrev').onclick = function () { go(at - 1); };
document.getElementById('btnPass').onclick = finishPass;
document.getElementById('btnReset').onclick = function () { go(0); };
document.getElementById('tabBubble').onclick = function () { setMode('bubble'); };
document.getElementById('tabSelection').onclick = function () { setMode('selection'); };
document.getElementById('tabInsertion').onclick = function () { setMode('insertion'); };

var elInput = document.getElementById('arrayInput');
var elError = document.getElementById('error');

function apply(text) {
  var result = parseArray(text);
  if (result.error) {
    elError.textContent = result.error;
    return;
  }
  elError.textContent = '';
  build(result.values);
  render();
}

document.getElementById('btnApply').onclick = function () {
  apply(elInput.value);
};

document.getElementById('btnDefault').onclick = function () {
  elInput.value = DEFAULT_TEXT;
  apply(DEFAULT_TEXT);
};

var presets = document.querySelectorAll('[data-preset]');
for (var p = 0; p < presets.length; p++) {
  presets[p].onclick = function () {
    elInput.value = this.getAttribute('data-preset');
    apply(elInput.value);
  };
}

document.addEventListener('keydown', function (e) {
  // Let the text field behave normally while it has focus.
  if (document.activeElement === elInput) {
    if (e.key === 'Enter') { apply(elInput.value); e.preventDefault(); }
    return;
  }
  if (e.key === 'ArrowRight' || e.key === ' ') { go(at + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { go(at - 1); e.preventDefault(); }
  if (e.key === 'Enter') { finishPass(); e.preventDefault(); }
});

build(SOURCE);
setMode('bubble');
</script>

</body>
</html>
